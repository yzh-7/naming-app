<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>取名 · 典籍取词</title>
    <meta name="description" content="从诗经/楚辞/论语/唐诗/宋词/道法/乐府取词取名，起点落音步、出处可核对，完全离线，无广告无追踪。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="取名 · 典籍取词" />
    <meta property="og:description" content="离线中文取名助手：从典籍原句里取词，每个名字给得出处、读音与字形账目，无广告无追踪。" />
    <link rel="canonical" href="https://yzh-7.github.io/naming-app/" />
    <meta property="og:url" content="https://yzh-7.github.io/naming-app/" />
    <meta property="og:image" content="https://yzh-7.github.io/naming-app/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="取名 · 典籍取词" />
    <meta name="twitter:description" content="离线中文取名助手：从典籍原句里取词，每个名字给得出处、读音与字形账目。" />
    <meta name="twitter:image" content="https://yzh-7.github.io/naming-app/icon-512.png" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!-- 构建时由 vite 的 transformIndexHtml 替换成 package.json 里的版本；没有分包产物时（单文件版）sw.js 读它决定缓存名，口径见 DESIGN.md「版本与缓存」 -->
    <meta name="app-version" content="__APP_VERSION__" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="取名" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      /* 先按已存偏好打上 dark，避免深色模式下加载时闪一下白底 */
      try {
        var t = localStorage.getItem('naming.theme.v1');
        if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* localStorage 不可用时保持跟随系统 */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:36rem;margin:3rem auto;padding:0 1.25rem;font:16px/1.75 system-ui,sans-serif;color:#191817">
        <h1 style="font-size:1.4rem">取名 · 典籍取词</h1>
        <p>这个应用把语料随页面一起发过来，取词、打分、筛选全部在你自己的浏览器里算，运行期间不向任何服务器请求数据，也没有账号与统计。也正因如此，它需要浏览器允许执行 JavaScript。</p>
        <p>请开启脚本后刷新本页；也可以用单文件版——一个 HTML 文件，下载后双击就能离线使用，见
          <a href="https://github.com/yzh-7/naming-app">github.com/yzh-7/naming-app</a>。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
