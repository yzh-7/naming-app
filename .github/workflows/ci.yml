name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: 构建数据 + 门禁 + 类型检查 + lint + 测试 + 构建 + 体积门禁
        run: npm run build
      - name: 单文件版构建 + 体积门禁（产物 dist-single/ 不发布，只为让那条体积口径真的是门禁）
        run: npm run single

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 构建
        run: npm run build
      - name: 端到端 + axe 可访问性扫描
        run: npm run test:e2e
      - name: 设计体检（40 组视口×主题×页面实测）
        run: npm run audit:design
